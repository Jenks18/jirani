name: Smoke tests — routing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site routing
        run: |
          set -euo pipefail

          # One request, redirects NOT followed. Prints "<status> <redirect target>".
          probe() {
            curl -sS -o /dev/null --max-time 15 -H "Cache-Control: no-cache" \
              -w '%{http_code} %{redirect_url}' "$1"
          }

          # Retry up to 3 times until the status matches the pattern. Leaves the
          # redirect target (if any) in $LOCATION. Reading the status and target from
          # curl's own -w output, not from header text, so HTTP/2's lowercase
          # "location:" and any 301/302/303/307/308 are all handled.
          LOCATION=""
          expect_status() {
            local url=$1 pattern=$2 tries=0 out="" status="none"
            echo "Checking $url (want $pattern) ..."
            while [ "$tries" -lt 3 ]; do
              out=$(probe "$url" || true)
              status=${out%% *}
              if [[ "$status" =~ ^($pattern)$ ]]; then
                LOCATION=${out#* }
                echo "  ok: $status ${LOCATION}"
                return 0
              fi
              tries=$((tries + 1))
              [ "$tries" -lt 3 ] && sleep 2
            done
            echo "  FAIL: wanted $pattern, got '${status:-none}'"
            return 1
          }

          expect_status https://jirani.the625movement.com 200

          expect_status https://jirani.the625movement.com/maps '301|302|303|307|308'
          if [[ "$LOCATION" != https://maps.the625movement.com* ]]; then
            echo "  FAIL: /maps redirects to '$LOCATION', expected https://maps.the625movement.com…"
            exit 1
          fi

          expect_status https://maps.the625movement.com 200

          echo "Smoke tests passed."
